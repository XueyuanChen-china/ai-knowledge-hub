server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router 使用浏览器路由，未知路径要回退到入口页面。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源文件名带 Vite hash，可以长期缓存；HTML 入口不缓存，保证发布后可更新。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
