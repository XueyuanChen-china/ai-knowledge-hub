name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_knowledge_hub_ci
  GRAPH_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_knowledge_hub_ci
  AUTH_JWT_SECRET: ci-only-secret-not-for-production
  AUTH_REDIS_URL: redis://localhost:6379/0
  ELASTICSEARCH_URL: http://localhost:9200
  CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
  UPLOAD_WORKER_ENABLED: "false"
  UPLOAD_PROCESSING_BACKEND: celery

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_knowledge_hub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_knowledge_hub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend test suite
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py"

  migration:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_knowledge_hub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_knowledge_hub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install migration dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Upgrade an empty PostgreSQL database
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          python scripts/setup_langgraph_checkpoints.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build

  integration:
    name: Compose dependency integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start stateful dependencies
        run: docker compose up -d --wait postgres elasticsearch rabbitmq redis
      - name: Verify dependency health
        run: docker compose ps
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Shut down stack
        if: always()
        run: docker compose down -v
