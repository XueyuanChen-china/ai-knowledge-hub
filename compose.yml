name: ai-knowledge-hub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_knowledge_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_knowledge_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  elasticsearch:
    # 与当前本机已缓存镜像保持一致，避免本地 E2E 因重复拉取镜像被网络阻塞。
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      network.host: 0.0.0.0
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 本地密钥从 backend/.env 注入；该文件必须被 .gitignore 忽略。
    env_file:
      - path: ./backend/.env
        required: false
    environment: &backend_environment
      APP_ENV: container
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_knowledge_hub
      GRAPH_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_knowledge_hub
      AUTH_REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      UPLOAD_WORKER_ENABLED: "false"
      UPLOAD_PROCESSING_BACKEND: celery
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["./scripts/start_worker.sh"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend_environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-10}
      CELERY_WORKER_QUEUES: ${CELERY_WORKER_QUEUES:-ai_knowledge_hub}
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  embedding-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["./scripts/start_worker.sh"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend_environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_EMBED_WORKER_CONCURRENCY:-1}
      CELERY_WORKER_QUEUES: ${CELERY_EMBED_QUEUE:-ai_knowledge_hub_embed}
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  elasticsearch_data:
  rabbitmq_data:
  redis_data:
